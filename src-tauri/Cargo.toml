[package]
name = "filebridge"
version = "0.1.0"
description = "Browse and edit files across SSH servers."
authors = ["Shane"]
edition = "2024"

[lib]
name = "filebridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
getrandom = "0.4"
# Platform features are required. keyring 3 has no default store; without these
# it uses an in-memory mock, so a keychain DEK would vanish on the next launch.
# Tests inject MemoryKeyStore and must not call OsKeyStore.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rusqlite = { version = "0.41", features = ["bundled"] }
# ring, not the aws-lc default: Windows CI has no NASM, and aws-lc-sys will not build there.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["alloc"] }
# linux-libxdo makes the predefined Cut, Copy, Paste, and Select All items work on GTK.
tauri = { version = "2", features = ["linux-libxdo"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
